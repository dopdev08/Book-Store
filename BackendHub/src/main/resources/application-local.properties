# Chỉ dùng trên máy dev/test: --spring.profiles.active=local
# KHÔNG bật profile này trên server thật (secret và tài khoản mẫu là công khai).
spring.datasource.url=jdbc:mysql://localhost:3307/truyenhub?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=truyenhub

# Nạp data-local.sql sau khi Hibernate tạo bảng
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.platform=local
spring.sql.init.encoding=UTF-8

# Upload ảnh chỉ chạy khi có biến môi trường Cloudinary thật
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:local}
cloudinary.api-key=${CLOUDINARY_API_KEY:local}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:local}

app.jwt.secret=truyenhub-local-only-secret-khong-dung-cho-production
